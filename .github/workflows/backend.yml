name: Backend checks
on:
  push:
    branches: ['backend/quick-match']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:vercel
        env:
          BEEF_LOCAL_DATABASE: '1'
          TURSO_DATABASE_URL: file:/tmp/beef-vercel-ci.db
      - run: npm ci --prefix beef --no-audit --no-fund
      - run: npm run typecheck --prefix beef
      - run: npm run lint --prefix beef
      - run: npm run build --prefix beef
# Deployment uses the native Vercel GitHub app connected to asoracca/Pitch.
# No persistent Vercel deployment credential is stored in GitHub Actions.
